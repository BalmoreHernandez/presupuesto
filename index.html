/* Marca G8b · tema B "Claro" (crema + navy + vino), igual que la app de fitness */
:root{
  --bg:#F6F1E9; --card:#FFFFFF; --line:#E4DCCF; --edge:#7D8697;
  --accent:#A3263A; --on-accent:#F6F1E9; --navy:#0E1A2E; --bronze:#7E5F28;
  --text:#0E1A2E; --muted:#566074; --err:#B42318; --pos:#1F6B4A;
  --radius:22px; --tabh:68px;
  --fh:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fb:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--fb);background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;overflow-x:hidden;
  padding-bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 45% at 100% 0%,rgba(64,108,190,.07),transparent 70%),radial-gradient(60% 40% at 0% 100%,rgba(163,38,58,.06),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
b,strong{font-weight:600}
a{color:var(--accent)}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---- cabecera ---- */
.top{position:sticky;top:0;z-index:5;background:rgba(14,26,46,.97);color:#F6F1E9;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.top .in{display:flex;align-items:center;gap:12px;max-width:1080px;margin:0 auto}
.logo{width:40px;height:40px;border-radius:50%;background:#F6F1E9;display:grid;place-items:center;flex:none;overflow:hidden}
.logo svg{width:100%;height:100%;display:block}
.brand{display:flex;align-items:center;gap:12px;min-width:0;color:inherit;text-decoration:none;background:none;border:0;padding:0;text-align:left}
.top h1{font-family:var(--fh);font-weight:800;font-size:17px;margin:0;line-height:1.15}
.top small{display:block;color:#B9C1D0;font-family:var(--fh);font-weight:800;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:2px;line-height:1.3}
.topnav{display:none;margin-left:auto;gap:4px}
.topnav button{border:0;background:transparent;color:#C9D0DC;font-family:var(--fh);font-weight:700;font-size:14px;padding:9px 12px;border-radius:12px;display:flex;align-items:center;gap:7px}
.topnav button svg{width:18px;height:18px}
.topnav button.on{background:rgba(246,241,233,.12);color:#F6F1E9}
.langbtn{margin-left:auto;flex:none;min-width:52px;min-height:40px;border-radius:12px;border:2px solid rgba(246,241,233,.55);background:transparent;color:#F6F1E9;font-family:var(--fh);font-weight:800;font-size:14px;letter-spacing:.06em}

main{max-width:600px;margin:0 auto;padding:16px 16px 0}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 14px;flex-wrap:wrap}
h2{font-family:var(--fh);font-weight:900;font-size:28px;line-height:1.05;letter-spacing:-.025em;margin:0}
h3{font-family:var(--fh);font-weight:800;font-size:17px;line-height:1.2;letter-spacing:-.01em;margin:0}
.kicker{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:800;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.kicker::before{content:"";flex:none;width:26px;height:4px;border-radius:2px;background:var(--accent)}
.hl{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.help{color:var(--muted);font-size:13.5px;margin:10px 0 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.lbl{font-family:var(--fh);font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-family:var(--fh);font-weight:800;font-size:13.5px;padding:6px 0;text-decoration:none;white-space:nowrap}
.neg{color:var(--err)!important}
.cols{display:block}
.headr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card-h>svg{width:26px;height:26px;color:var(--accent);flex:none}

/* ---- botones ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:8px;padding:8px 18px;min-height:52px;border:2px solid var(--accent);border-radius:16px;
  background:var(--accent);color:var(--on-accent);font-family:var(--fh);font-weight:800;font-size:14.5px;letter-spacing:.04em;text-decoration:none;line-height:1.2}
.btn svg{width:18px;height:18px;flex:none}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{min-height:42px;padding:6px 14px;font-size:13.5px;border-radius:13px}
.btn.danger{color:var(--err);border-color:var(--err);background:transparent}
.btn.done{background:var(--bg);color:var(--muted);border-color:var(--line)}
.btn:active{transform:scale(.98)}
button:disabled{opacity:.65;cursor:default}
.icobtn{flex:none;width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--text)}
.icobtn svg{width:20px;height:20px}
.ico{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---- selector de mes ---- */
.month{display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:3px}
.month button{border:0;background:none;min-height:40px;border-radius:12px}
.month .arr{width:40px;display:grid;place-items:center;color:var(--text)}
.month .arr svg{width:20px;height:20px}
.month .ml{font-family:var(--fh);font-weight:800;font-size:15px;padding:0 6px;min-width:142px;color:var(--text)}

/* ---- avisos ---- */
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:2px solid var(--line);border-left:6px solid var(--bronze);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14.5px}
.banner b{color:var(--bronze)}
.privacy{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--text)}
.privacy svg{width:22px;height:22px;flex:none;color:var(--accent);margin-top:1px}

/* ---- tarjeta principal (balance) ---- */
.hero{background:var(--navy);color:#F6F1E9;border-radius:var(--radius);padding:20px;margin-bottom:14px}
.hero .lbl{color:#B9C1D0}
.hero .big{display:block;font-family:var(--fh);font-weight:900;font-size:38px;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px;overflow-wrap:anywhere}
.hero .big.neg{color:#F4A7B2!important}
.hero p{margin:0 0 14px;color:#C9D0DC;font-size:14px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio div{min-width:0}
.trio small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.trio b{display:block;font-family:var(--fh);font-weight:800;font-size:16.5px;overflow-wrap:anywhere;line-height:1.25}
.hero .trio{border-top:1px solid rgba(246,241,233,.18);padding-top:14px}
.hero .trio small{color:#B9C1D0}
.box3{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px}
.bigv{font-family:var(--fh);font-weight:900;font-size:28px;letter-spacing:-.02em;margin:0 0 8px;overflow-wrap:anywhere}

/* ---- barras ---- */
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--err)}
.catrow{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:8px 0}
.catrow span{display:flex;align-items:center;gap:8px;min-width:0}
.catrow span i{width:10px;height:10px;border-radius:50%;flex:none}
.catrow small{color:var(--muted);min-width:36px;text-align:right}
.catrow .bar{grid-column:1/-1;height:7px}

/* ---- gráfico 6 meses ---- */
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;padding-top:6px}
.chart>div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.chart .cols2{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.chart .cols2 span{width:40%;max-width:16px;border-radius:5px 5px 2px 2px;min-height:2px}
.chart .inc{background:var(--navy)} .chart .exp{background:var(--accent)}
.chart small{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:capitalize}
.chart .cur small{color:var(--text);font-weight:800}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---- listas ---- */
.day h4{margin:14px 0 4px;font-family:var(--fh);font-weight:800;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.day:first-child h4{margin-top:0}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 4px;border:0;border-top:2px solid var(--line);background:none;text-align:left;color:var(--text)}
.day .row:first-of-type,.list>.row:first-child{border-top:0}
.row .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg);color:var(--muted)}
.row .ic svg{width:19px;height:19px}
.row .ic.income{color:var(--pos)} .row .ic.expense{color:var(--accent)} .row .ic.transfer{color:var(--navy)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{flex:none;font-family:var(--fh);font-weight:800;font-size:15.5px;white-space:nowrap;text-align:right}
.amt.income{color:var(--pos)}
.empty{text-align:center;padding:18px 8px;color:var(--muted)}
.empty svg{width:30px;height:30px;color:var(--accent)}
.empty b{display:block;color:var(--text);font-family:var(--fh);margin:6px 0 2px}
.empty p{margin:0 0 12px;font-size:14.5px}
.lim{display:block;width:100%;padding:12px 2px;border:0;border-top:2px solid var(--line);background:none;text-align:left;color:var(--text)}
.lim:first-of-type{border-top:0}
.lim .tp{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;align-items:baseline}
.lim .tp span{font-family:var(--fh);font-weight:800;white-space:nowrap}
.lim .tp small{color:var(--muted);font-family:var(--fb);font-weight:500}
.lim>small{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.bill{display:flex;align-items:center;gap:10px;border-top:2px solid var(--line);padding:10px 0}
.bill:first-of-type{border-top:0}
.bill .row{border:0;padding:0;min-height:52px;flex:1;min-width:0}
.dayb{flex:none;width:44px;height:46px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fh);font-weight:900;font-size:17px;line-height:1}
.dayb small{font-size:9px;letter-spacing:.1em;color:var(--muted);font-weight:800;margin-bottom:3px;text-transform:uppercase}
.goalact{display:flex;justify-content:flex-end;margin-top:-4px;padding-bottom:6px}

/* ---- movimientos: búsqueda y filtros ---- */
.search{display:flex;gap:8px;margin-bottom:10px}
.search label{flex:1;display:flex;align-items:center;gap:8px;border:2px solid var(--edge);border-radius:14px;padding:0 12px;background:var(--bg);min-height:48px}
.search label svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-weight:600;font-size:14px;color:var(--muted)}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#F6F1E9}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.count{font-size:13px;color:var(--muted);margin:4px 0 6px}

/* ---- formularios ---- */
.field{display:block;margin-bottom:14px;min-width:0}
.field>span,label.f{display:block;font-family:var(--fh);font-weight:800;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.inp{width:100%;min-height:52px;border:2px solid var(--edge);border-radius:14px;padding:0 14px;background:var(--bg);color:var(--text);font-size:16px;outline:none}
textarea.inp{padding:12px 14px;min-height:76px;resize:vertical}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:#6B7487}
.inp.money{font-family:var(--fh);font-weight:800;font-size:22px}
.inp.bad{border-color:var(--err)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#566074 50%),linear-gradient(135deg,#566074 50%,transparent 50%);background-position:calc(100% - 20px) 23px,calc(100% - 14px) 23px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.err{color:var(--err);font-weight:600;font-size:14px;margin:0 0 12px}
.seg{display:flex;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;min-height:44px;border:none;border-radius:12px;background:transparent;font-weight:600;color:var(--muted);font-size:15px;padding:4px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 2px var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:0 0 12px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
.acctset{border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--bg)}
.acctset .check{margin:0;font-weight:600;font-size:15px;align-items:center}
.acctset .field{margin:10px 0 0}
.acctset .inp{background:var(--card)}

/* ---- hoja (modal) ---- */
.backdrop{position:fixed;inset:0;z-index:30;background:rgba(14,26,46,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-h h3{font-size:20px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.actions .grow{margin-right:auto}

/* ---- barra inferior y botón + ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:600px}
nav.tabs button{flex:1;min-width:0;height:var(--tabh);border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--fh);font-size:10.5px;font-weight:800;color:var(--muted);position:relative;padding:0 2px}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));z-index:11;width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 10px 26px rgba(163,38,58,.35)}
.fab svg{width:28px;height:28px}
.headadd{display:none}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,calc(-100% - 60px));transition:transform .25s,visibility 0s .25s;visibility:hidden;background:var(--card);border:2px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:16px;font-weight:600;z-index:40;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(14,26,46,.18)}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .25s,visibility 0s}

/* ---- lead / plan gratis ---- */
.lead{position:relative;border-color:var(--accent)}
.lead .hp{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
.teaser{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,#FFFFFF 0%,#FBF4F1 100%);border-color:#E8C9CF}
.teaser .gift{flex:none;width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.teaser .gift svg{width:26px;height:26px}
.teaser p{margin:6px 0 12px;font-size:14.5px}
.teaser .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.perks{list-style:none;margin:10px 0 14px;padding:0;font-size:14.5px}
.perks li{display:flex;gap:8px;margin:5px 0}
.perks li::before{content:"✓";color:var(--accent);font-weight:900}

/* ---- más: redes, menú ---- */
.menu{display:grid;gap:8px}
.socials{display:grid;gap:10px}
.socials a{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-radius:14px;background:var(--bg);border:2px solid var(--line);color:var(--text);text-decoration:none}
.socials a svg{width:24px;height:24px;flex:none;color:var(--accent)}
.socials a b{display:block;font-family:var(--fh);font-weight:800;font-size:14px}
.socials a span span{display:block;font-size:13.5px;color:var(--muted)}
.socials a i{margin-left:auto;font-style:normal;color:var(--accent);font-weight:700}
.about{display:flex;gap:14px;align-items:flex-start}
.about .logo{width:52px;height:52px;box-shadow:0 0 0 2px var(--line)}
.slogan{font-family:var(--fh);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:8px 0 0}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin:18px 0 22px}
.foot .soc{display:flex;justify-content:center;gap:10px;margin-bottom:10px}
.foot .soc a{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--navy)}
.foot .soc a svg{width:20px;height:20px}
.foot p{margin:4px 0}
.foot .sl{font-family:var(--fh);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--navy)}

/* ---- bienvenida ---- */
.welcome{max-width:520px;margin:0 auto}
.welcome .logo{width:64px;height:64px;box-shadow:0 0 0 2px var(--line);margin-bottom:12px}
.welcome h2{font-size:30px;margin-bottom:8px}
.welcome .lead-p{margin:0 0 16px;color:var(--muted)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}

/* ---- escritorio ---- */
@media (min-width:900px){
  body{padding-bottom:24px}
  main{max-width:1080px;padding-top:22px}
  .topnav{display:flex}
  .langbtn{margin-left:8px}
  nav.tabs,.fab{display:none}
  .headadd{display:inline-flex}
  .cols{column-count:2;column-gap:16px}
  .cols>*{break-inside:avoid;display:block}
  .cols>.card{display:block}
  .narrow{max-width:640px}
  .backdrop{align-items:center}
  .sheet{border-radius:24px;max-height:88vh}
}
@media (max-width:370px){ .month .ml{min-width:120px;font-size:14px} h2{font-size:25px} .hero .big{font-size:32px} }

    if (r.type === "transfer") return s + (r.to === id ? r.amount : 0) - (r.account === id ? r.amount : 0);

const field = (label, inner, id = "", hidden = false) => `<label class="field" ${id ? `id="${id}"` : ""} ${hidden ? "hidden" : ""}><span>${label}</span>${inner}</label>`;
const moneyInp = (id, val) => `<input class="inp money" id="${id}" inputmode="decimal" autocomplete="off" placeholder="${amtPh()}" value="${val == null ? "" : centsToInput(val)}">`;
const sel = (id, opts, v) => `<select class="inp" id="${id}">${opts.map(([k, l]) => `<option value="${esc(k)}" ${k === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
const accOpts = () => S.accounts.map(a => [a.id, a.name]);
function openSheet(kind, id) {
  if (["tx", "bill"].includes(kind) && !S.accounts.length) { toast(t("errNoAccount")); kind = "account"; id = null; }
  UI.sheet = { kind, id }; renderSheet();
}
function closeSheet() { UI.sheet = null; $("#sheetRoot").innerHTML = ""; document.body.style.overflow = ""; }
function renderSheet() {
  const { kind, id } = UI.sheet;
  const item = id ? { tx: S.tx, account: S.accounts, budget: S.budgets, goal: S.goals, goalAdd: S.goals, bill: S.bills }[kind].find(x => x.id === id) : null;
  if (id && !item) return closeSheet();
  const d = item || {};
  let title, body;
  if (kind === "tx" || kind === "bill") {
    const type = d.type || "expense", types = kind === "bill" ? ["expense", "income"] : ["expense", "income", "transfer"];
    title = item ? (kind === "tx" ? t("editTx") : t("editBill")) : kind === "tx" ? t("newTx") : t("newBill");
    body = `<div class="seg" id="sType" role="group" aria-label="${t("type")}">${types.map(x => `<button type="button" data-act="sType" data-v="${x}" class="${x === type ? "on" : ""}" aria-pressed="${x === type}">${x === "transfer" ? t("transfer") : t(x + "One")}</button>`).join("")}</div>
      <input type="hidden" id="sTypeV" value="${type}">
      ${field(t("amount") + " (" + cur() + ")", moneyInp("sAmount", d.amount))}
      ${field(kind === "bill" ? t("name") : t("details"), `<input class="inp" id="sName" maxlength="120" autocomplete="off" placeholder="${t("detailsPh")}" value="${esc(d.name || "")}">`)}
      <div class="g2">${kind === "bill" ? field(t("day"), `<input class="inp" id="sDay" type="number" min="1" max="31" step="1" inputmode="numeric" value="${d.day || ""}">`)
        : field(t("date"), `<input class="inp" id="sDate" type="date" value="${d.date || (UI.month === thisMonth() ? todayISO() : UI.month + "-01")}">`)}
        ${field(`<span id="sAccL">${type === "transfer" ? t("from") : t("account")}</span>`, sel("sAccount", accOpts(), d.account || S.accounts[0]?.id))}</div>
      ${field(t("to"), sel("sTo", accOpts(), d.to || (S.accounts[1] || S.accounts[0])?.id), "sToF", type !== "transfer")}
      ${field(t("category"), sel("sCatE", EXPENSE_CATS.map(c => [c, catName(c)]), type === "expense" ? d.category : "food"), "sCatEF", type !== "expense")}
      ${field(t("category"), sel("sCatI", INCOME_CATS.map(c => [c, catName(c)]), type === "income" ? d.category : "salary"), "sCatIF", type !== "income")}
      ${kind === "tx" ? field(t("note"), `<textarea class="inp" id="sNote" maxlength="500" rows="2">${esc(d.note || "")}</textarea>`) : `<p class="help" style="margin-top:0">${t("billHint")}</p>`}`;
  } else if (kind === "account") {
    const type = d.type || "bank", debt = DEBT_TYPES.includes(type);
    title = item ? t("editAccount") : t("newAccount");
    body = `${field(t("name"), `<input class="inp" id="sName" maxlength="120" autocomplete="off" value="${esc(d.name || "")}">`)}
      ${field(t("type"), sel("sAccType", ACCOUNT_TYPES.map(x => [x, t(x)]), type))}
      ${field(`<span id="sOpenL">${debt ? t("owed") : t("opening")}</span>`, moneyInp("sOpening", item ? Math.abs(d.opening) : null))}
      <p class="help" style="margin-top:0">${t("creditHint")}</p>`;
  } else if (kind === "budget") {
    const used = budgetsOf(UI.month).filter(b => b.id !== id).map(b => b.category), cats = EXPENSE_CATS.filter(c => !used.includes(c));
    title = item ? t("editBudget") : t("newBudget");
    body = `${field(t("category"), sel("sBudCat", cats.map(c => [c, catName(c)]), d.category || cats[0]))}${field(t("limit") + " (" + cur() + ")", moneyInp("sAmount", d.amount))}
      <p class="help" style="margin-top:0">${monthLabel(d.month || UI.month)}</p>`;
  } else if (kind === "goal") {
    title = item ? t("editGoal") : t("newGoal");
    body = `${field(t("name"), `<input class="inp" id="sName" maxlength="120" autocomplete="off" value="${esc(d.name || "")}">`)}
      <div class="g2">${field(t("target"), moneyInp("sTarget", d.target))}${field(t("saved"), moneyInp("sSaved", item ? d.saved : null))}</div>
      ${field(t("goalDate"), `<input class="inp" id="sGoalDate" type="date" value="${d.date || ""}">`)}<p class="help" style="margin-top:0">${t("goalHint")}</p>`;
  } else if (kind === "goalAdd") {
    title = t("addToGoalT", { n: d.name });
    body = `${field(t("amount") + " (" + cur() + ")", moneyInp("sAmount", null))}<p class="help" style="margin-top:0">${money(d.saved)} / ${money(d.target)}</p>`;
  }
  const canDel = item && kind !== "goalAdd";
  $("#sheetRoot").innerHTML = `<div class="backdrop" data-act="sheetBg"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" data-kind="${kind}">
    <div class="sheet-h"><h3 id="sheetTitle">${esc(title)}</h3><button type="button" class="icobtn" data-act="closeSheet" aria-label="${t("close")}">${I("x")}</button></div>
    <form id="sheetForm" novalidate>${body}<p class="err" id="sErr" role="alert" hidden></p>

  document.body.style.overflow = "hidden";
  setTimeout(() => { const f = $("#sAmount") || $("#sName"); if (f && matchMedia("(pointer:fine)").matches) f.focus(); }, 30);
}
function setSheetType(type) {
  $("#sTypeV").value = type;
  $$("#sType button").forEach(b => { const on = b.dataset.v === type; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  $("#sToF").hidden = type !== "transfer"; $("#sCatEF").hidden = type !== "expense"; $("#sCatIF").hidden = type !== "income";
  $("#sAccL").textContent = type === "transfer" ? t("from") : t("account");
}
function sheetErr(msg, el) { const e = $("#sErr"); e.textContent = msg; e.hidden = false; $$(".inp.bad").forEach(x => x.classList.remove("bad")); if (el) { el.classList.add("bad"); el.focus(); } return false; }
function submitSheet() {
  const { kind, id } = UI.sheet, v = s => ($(s)?.value ?? "").trim();
  const list = { tx: "tx", account: "accounts", budget: "budgets", goal: "goals", goalAdd: "goals", bill: "bills" }[kind];
  const old = id ? S[list].find(x => x.id === id) : null;
  let rec;
  if (kind === "tx" || kind === "bill") {
    const type = v("#sTypeV"), amount = toCents(v("#sAmount"));
    if (!(amount > 0) || amount > 1e13) return sheetErr(t("errAmount"), $("#sAmount"));
    const account = v("#sAccount"), to = v("#sTo");
    const category = type === "transfer" ? "transfer" : type === "income" ? v("#sCatI") : v("#sCatE");
    if (type === "transfer") { if (S.accounts.length < 2) return sheetErr(t("errNeed2")); if (account === to) return sheetErr(t("errSameAcc"), $("#sTo")); }
    const name = v("#sName") || (type === "transfer" ? t("transferName") : catName(category));
    if (kind === "tx") {
      const date = v("#sDate"); if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return sheetErr(t("errDate"), $("#sDate"));
      rec = { id: id || uid(), type, amount, name, date, account, category, note: v("#sNote") };
      if (type === "transfer") rec.to = to;
      if (old?.bill) { rec.bill = old.bill; rec.billMonth = old.billMonth; }
    } else {
      if (!v("#sName")) return sheetErr(t("errName"), $("#sName"));
      const day = Number(v("#sDay")); if (!Number.isInteger(day) || day < 1 || day > 31) return sheetErr(t("errDay"), $("#sDay"));
      rec = { id: id || uid(), type, amount, name, day, account, category };
    }
  } else if (kind === "account") {
    const name = v("#sName"), type = v("#sAccType"), raw = v("#sOpening"), c = raw ? toCents(raw) : 0;
    if (!name) return sheetErr(t("errName"), $("#sName"));
    if (Number.isNaN(c) || c < 0 || c > 1e13) return sheetErr(t("errAmount").replace(/ mayor que 0| greater than 0/, ""), $("#sOpening"));
    rec = { id: id || uid(), name, type, opening: DEBT_TYPES.includes(type) ? -c : c };
  } else if (kind === "budget") {
    const category = v("#sBudCat"), amount = toCents(v("#sAmount"));
    if (!category || budgetsOf(UI.month).some(b => b.category === category && b.id !== id)) return sheetErr(t("errBudgetExists"));
    if (!(amount > 0) || amount > 1e13) return sheetErr(t("errAmount"), $("#sAmount"));
    rec = { id: id || uid(), month: old?.month || UI.month, category, amount };
  } else if (kind === "goal") {
    const name = v("#sName"), target = toCents(v("#sTarget")), savedRaw = v("#sSaved"), saved = savedRaw ? toCents(savedRaw) : 0;
    if (!name) return sheetErr(t("errName"), $("#sName"));
    if (!(target > 0) || target > 1e13) return sheetErr(t("errAmount"), $("#sTarget"));
    if (Number.isNaN(saved) || saved < 0 || saved > 1e13) return sheetErr(t("errAmount"), $("#sSaved"));
    rec = { id: id || uid(), name, target, saved, date: v("#sGoalDate") };
  } else if (kind === "goalAdd") {
    const amount = toCents(v("#sAmount")); if (!(amount > 0) || amount > 1e13) return sheetErr(t("errAmount"), $("#sAmount"));
    rec = { ...old, saved: old.saved + amount };
  }
  if (old) S[list] = S[list].map(x => (x.id === id ? rec : x)); else S[list].push(rec);
  save(); closeSheet(); render(); toast(t("savedT")); return true;
}
function deleteItem() {
  const { kind, id } = UI.sheet, list = { tx: "tx", account: "accounts", budget: "budgets", goal: "goals", bill: "bills" }[kind];
  if (kind === "account" && (S.tx.some(r => r.account === id || r.to === id) || S.bills.some(b => b.account === id))) return sheetErr(t("errAccountUse"));
  if (!confirm(t("confirmDelete"))) return false;
  S[list] = S[list].filter(x => x.id !== id);
  save(); closeSheet(); render(); toast(t("deletedT")); return true;
}

/* =====================================================================
   FORMULARIO DE LEADS  ·  único dato que sale del teléfono (nombre, correo, WhatsApp, meta, idioma)
   ===================================================================== */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
async function submitLead(form) {
  const fd = new FormData(form), g = k => String(fd.get(k) || "").trim(), err = $("#leadErr");
  const fail = (msg, el) => { err.innerHTML = msg; err.hidden = false; $$("#leadForm .inp.bad").forEach(x => x.classList.remove("bad")); if (el) { el.classList.add("bad"); el.focus(); } };
  if (g("website")) { S.lead = { sent: true, name: "" }; save(); render(); return "honeypot"; } // bot: no se envía nada
  const nombre = g("nombre"), email = g("email"), whatsapp = g("whatsapp");
  if (!nombre) { fail(t("leadNeedName"), $("#lNombre")); return "invalid-name"; }
  if (!EMAIL_RE.test(email)) { fail(t("leadNeedEmail"), $("#lEmail")); return "invalid-email"; }
  const digits = whatsapp.replace(/\D/g, "");
  if (whatsapp && (!/^[+\d][\d\s().-]*$/.test(whatsapp) || digits.length < 7 || digits.length > 15)) { fail(t("leadBadWa"), $("#lWa")); return "invalid-wa"; }
  err.hidden = true; $$("#leadForm .inp.bad").forEach(x => x.classList.remove("bad"));
  const url = String(CONFIG.LEAD_FORM_URL || "").trim();
  if (!url) { window.open(waUrl(), "_blank", "noopener"); return "whatsapp"; }
  if (navigator.onLine === false) { fail(t("leadOffline")); return "offline"; }
  const body = new URLSearchParams({ nombre, email, whatsapp, objetivo: g("objetivo"), idioma: g("idioma") || S.lang, fuente: CONFIG.LEAD_SOURCE });
  const btn = $("#leadBtn"); btn.disabled = true; btn.textContent = t("leadSending");
  try {
    await fetch(url, { method: "POST", mode: "no-cors", body }); // respuesta opaca: si no lanza error, se considera enviado
    S.lead = { sent: true, name: nombre }; save(); render(); toast(t("leadThanks", { name: "" })); return "sent";
  } catch (e) {
    btn.disabled = false; btn.textContent = t("leadSend");
    fail(`${esc(t("leadFail"))} <a href="${esc(waUrl())}" target="_blank" rel="noopener">WhatsApp →</a>`); return "error";
  }
}

/* =====================================================================
   ACCIONES
   ===================================================================== */
function go(tab) { S.tab = tab; save(); closeSheet(); render(); window.scrollTo(0, 0); }
function startSetup() {
  const err = $("#wErr"), rows = [["Cash", "cash", t("nameCash")], ["Bank", "bank", t("nameBank")], ["Card", "credit", t("nameCard")]];
  const accounts = [];
  for (const [k, type, name] of rows) {
    if (!$("#w" + k).checked) continue;
    const raw = $("#w" + k + "Amt").value.trim(), c = raw ? toCents(raw) : 0;
    if (Number.isNaN(c) || c < 0) { err.textContent = t("errAmount").replace(/ mayor que 0| greater than 0/, ""); err.hidden = false; $("#w" + k + "Amt").classList.add("bad"); return false; }
    accounts.push({ id: uid(), name, type, opening: type === "credit" ? -c : c });
  }
  if (!accounts.length) { err.textContent = t("needAccount"); err.hidden = false; return false; }
  S.currency = $("#wCurrency").value;
  loadData({ accounts, tx: [], budgets: [], goals: [], bills: [] }, false);
  S.tab = "inicio"; UI.month = thisMonth(); save(); render(); window.scrollTo(0, 0); toast(t("welcomeDone"));
  try { navigator.storage?.persist?.(); } catch (e) {}
  return true;
}
async function shareBackup() {
  const json = JSON.stringify(backupObj(), null, 1), file = new File([json], backupName(), { type: "application/json" });
  try { await navigator.share({ files: [file], title: t("appName") + " · " + CONFIG.BRAND_NAME }); S.lastBackup = todayISO(); save(); render(); } catch (e) {}
}
function importText(text) {
  let d; try { d = parseBackup(text); } catch (e) { toast(t("importBad")); return "invalid"; }
  if (!confirm(t("importConfirm", { n: d.tx.length, a: d.accounts.length }))) return "cancelled";
  S.currency = d.currency; loadData(d, d.sample); S.tab = "inicio"; UI.month = thisMonth(); save(); render(); window.scrollTo(0, 0); toast(t("importOk")); return "ok";
}
const ACT = {
  tab: el => go(el.dataset.tab),
  lang: () => { S.lang = S.lang === "es" ? "en" : "es"; save(); closeSheet(); render(); },
  month: el => { UI.month = shiftMonth(UI.month, +el.dataset.v); renderMain(); },
  monthNow: () => { UI.month = thisMonth(); renderMain(); },
  newTx: () => openSheet("tx"), editTx: el => openSheet("tx", el.dataset.id),
  newAccount: () => openSheet("account"), editAccount: el => openSheet("account", el.dataset.id),
  newBudget: () => openSheet("budget"), editBudget: el => openSheet("budget", el.dataset.id),
  newGoal: () => openSheet("goal"), editGoal: el => openSheet("goal", el.dataset.id), goalAdd: el => openSheet("goalAdd", el.dataset.id),
  newBill: () => openSheet("bill"), editBill: el => openSheet("bill", el.dataset.id),
  sType: el => setSheetType(el.dataset.v),
  closeSheet: () => closeSheet(), sheetBg: (el, e) => { if (e.target === el) closeSheet(); },
  delItem: () => deleteItem(),
  payBill: el => {
    const b = S.bills.find(x => x.id === el.dataset.id), m = UI.month; if (!b || billPaid(b, m)) return;
    const date = m === thisMonth() ? todayISO() : `${m}-${pad(Math.min(b.day, daysIn(m)))}`;
    S.tx.push({ id: uid(), type: b.type, amount: b.amount, name: b.name, date, account: b.account, category: b.category, note: "", bill: b.id, billMonth: m });
    save(); renderMain(); toast(t("billPaid"));
  },
  copyPrev: () => {
    const m = UI.month, pm = shiftMonth(m, -1), have = budgetsOf(m).map(b => b.category);
    budgetsOf(pm).filter(p => !have.includes(p.category)).forEach(p => S.budgets.push({ id: uid(), month: m, category: p.category, amount: p.amount }));
    save(); renderMain(); toast(t("copied", { m: monthLabel(pm, { month: "long" }) }));
  },
  toggleFilters: () => { UI.showFilters = !UI.showFilters; renderMain(); },
  fType: el => { UI.fType = el.dataset.v; $$("#typeChips button").forEach(b => b.classList.toggle("on", b.dataset.v === UI.fType)); renderTxList(); },
  csv: () => download(`presupuesto-${todayISO()}.csv`, "\uFEFF" + toCSV(), "text/csv;charset=utf-8"),
  exportJson: () => { download(backupName(), JSON.stringify(backupObj(), null, 1), "application/json"); S.lastBackup = todayISO(); save(); toast(t("backupOk")); const lb = $("#lastBackup"); if (lb) lb.textContent = t("lastBackup", { d: dateLabel(S.lastBackup) }); },
  shareJson: () => shareBackup(),
  importJson: () => { const f = $("#importFile"); f.value = ""; f.click(); },
  leadGo: () => { go("mas"); const f = $("#leadForm"); if (f) { f.scrollIntoView({ block: "start" }); window.scrollBy(0, -80); } },
  leadHide: () => { S.leadHide = true; save(); renderMain(); },
  leadAgain: () => { S.lead = { sent: false, name: "" }; save(); render(); },
  sampleStart: () => { const c = $("#wCurrency"); S.currency = c ? c.value : S.currency || guessCurrency(); loadData(sampleData(), true); S.tab = "inicio"; UI.month = thisMonth(); save(); render(); window.scrollTo(0, 0); },
  sampleExit: () => { if (!confirm(t("sampleConfirm"))) return; clearData(); save(); render(); window.scrollTo(0, 0); },
  reset: () => { if (!confirm(t("resetConfirm"))) return; clearData(); S.tab = "inicio"; S.lastBackup = ""; save(); render(); window.scrollTo(0, 0); toast(t("resetDone")); }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el && ACT[el.dataset.act]) { if (el.tagName === "BUTTON" && el.type !== "submit") e.preventDefault(); ACT[el.dataset.act](el, e); } });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "sheetForm") submitSheet();
  else if (e.target.id === "leadForm") submitLead(e.target);
  else if (e.target.id === "welcomeForm") startSetup();
});
document.addEventListener("input", e => { if (e.target.id === "q") { UI.q = e.target.value; renderTxList(); } if (e.target.classList.contains("bad")) e.target.classList.remove("bad"); });
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "fCat") { UI.fCat = e.target.value; renderTxList(); }
  else if (id === "fAcc") { UI.fAcc = e.target.value; renderTxList(); }
  else if (id === "setCurrency") { S.currency = e.target.value; save(); render(); }
  else if (id === "setLang") { S.lang = e.target.value; save(); render(); }
  else if (id === "sAccType") $("#sOpenL").textContent = DEBT_TYPES.includes(e.target.value) ? t("owed") : t("opening");
  else if (/^w(Cash|Bank|Card)$/.test(id)) $("#" + id + "F").hidden = !e.target.checked;
  else if (id === "importFile" && e.target.files[0]) { const r = new FileReader(); r.onload = () => importText(String(r.result)); r.readAsText(e.target.files[0]); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && UI.sheet) closeSheet(); });
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
